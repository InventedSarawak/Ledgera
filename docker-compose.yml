services:
    ledgera-postgres-2:
        image: postgis/postgis:15-3.3-alpine
        restart: always
        container_name: ledgera-postgres-2
        environment:
            POSTGRES_USER: ledgera_user
            POSTGRES_PASSWORD: ledgera_password
            POSTGRES_DB: ledgera_db
        ports:
            - '5433:5432'
        volumes:
            - postgres_data_2:/var/lib/postgresql/data

    ledgera-redis-2:
        image: redis:7-alpine
        restart: always
        container_name: ledgera-redis-2
        ports:
            - '6380:6379'

volumes:
    postgres_data_2:
